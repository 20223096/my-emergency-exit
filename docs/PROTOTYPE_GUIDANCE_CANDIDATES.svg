    <g fill="#fff" stroke="#7a53c8" stroke-width="5">
      <circle cx="845" cy="334" r="17"/><circle cx="425" cy="450" r="17"/><circle cx="635" cy="392" r="17"/><circle cx="635" cy="624" r="17"/>
