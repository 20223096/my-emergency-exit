<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">서울역 일부 단순화 그래프의 안내 후보 노드</title>
  <desc id="desc">실제 지도 좌표가 아닌 프로토타입 그래프 상대좌표에 C_EAST, C_WEST, P_SOUTH, C_CENTER 안내 후보를 표시한 개념도</desc>
  <rect width="1400" height="850" fill="#f7f8fb"/>
  <text x="60" y="66" font-family="sans-serif" font-size="30" font-weight="700" fill="#171719">프로토타입 그래프 · 안내 후보 지점</text>
  <text x="60" y="100" font-family="sans-serif" font-size="17" fill="#60646c">실제 서울역 지도·시설 좌표가 아닌 SVG 상대좌표 개념도 / 공식 피난 안내 아님</text>
  <rect x="55" y="135" width="1290" height="610" rx="20" fill="#fff" stroke="#dfe3ea" stroke-width="2"/>
  <g transform="translate(110 160) scale(105 58)" stroke="#c8cdd6" stroke-width="0.055" fill="none" stroke-linecap="round">
    <path d="M8 3L7 3 M1 5L3 5 M4 8L5 8 M5 8L5.5 7.5 M5.5 7.5L5.5 5 M5 8L3.5 7.5 M3.5 7.5L3.5 5.5 M5.5 5L5 4 M3.5 5.5L3 5 M3 5L5 4 M5 4L7 3 M7 3L9 2.5 M9 2.5L10 2 M5 4L7 1.5 M7 1.5L8 .5 M5 4L5 1.5 M5 1.5L5 .5 M3 5L2.5 2.5 M2.5 2.5L2.5 1.3 M3 5L1 3.5 M1 3.5L0 3"/>
  </g>
  <g transform="translate(110 160) scale(105 58)" fill="none" stroke-linecap="round">
    <path d="M4 8L5 8L5.5 7.5L5.5 5L5 4L7 1.5L8 .5" stroke="#3e5af4" stroke-width="0.095"/>
    <path d="M5 8L3.5 7.5L3.5 5.5L3 5L2.5 2.5L2.5 1.3" stroke="#02a67c" stroke-width="0.095" stroke-dasharray=".18 .12"/>
    <path d="M7 1.5L8 .5" stroke="#ef4452" stroke-width="0.13"/>
    <path d="M5.5 7.5L5.5 5" stroke="#ef4452" stroke-width="0.13" stroke-dasharray=".2 .1"/>
  </g>
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
